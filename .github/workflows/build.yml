name: Build ImmortalWrt for HINLINK H68K

on:
  workflow_dispatch:
    inputs:
      iw_branch:
        description: "ImmortalWrt 分支 (默认 master)"
        required: false
        default: "master"
      upload_packages:
        description: "连同全部软件包一起打包上传（体积大，用于离线装依赖）"
        type: boolean
        required: false
        default: false

env:
  IW_REPO: immortalwrt/immortalwrt
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: rockchip/armv8 -> hinlink_h68k
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    defaults:
      run:
        working-directory: openwrt

    steps:
      - name: 释放 runner 磁盘空间
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h /

      - name: 拉取 ImmortalWrt 源码
        uses: actions/checkout@v4
        with:
          repository: ${{ env.IW_REPO }}
          ref: ${{ inputs.iw_branch || 'master' }}
          path: openwrt
          fetch-depth: 1

      - name: 拉取本定制仓库
        uses: actions/checkout@v4
        with:
          path: h68k-custom
          fetch-depth: 1

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-pyelftools \
            python3-setuptools rsync swig unzip zlib1g-dev file wget tzdata \
            cmake device-tree-compiler libelf-dev ccache

      - name: 移植 HINLINK H68K 官方支持到 ImmortalWrt 源码
        run: python3 ../h68k-custom/scripts/patch_hinlink.py .

      - name: 接入第三方插件 (iStore / Lucky) + usblp 内核内置
        run: |
          # Lucky：本地包接入（run1 缺 lucky 二进制包目录的问题已修，run3 验证 界面+本体 双 ✔）
          git clone --depth=1 https://github.com/sirpdboy/luci-app-lucky.git /tmp/lucky
          mkdir -p package/lucky/luci-app-lucky package/lucky/lucky
          cp -r /tmp/lucky/luci-app-lucky/. package/lucky/luci-app-lucky/
          cp -r /tmp/lucky/lucky/. package/lucky/lucky/
          rm -rf /tmp/lucky
          # iStore：本地包方式（与 lucky 同款，run3 验证 taskd/luci-lib-taskd 符号可见）
          git clone --depth=1 https://github.com/linkease/istore.git /tmp/istore
          mkdir -p package/istore
          cp -r /tmp/istore/luci/. package/istore/
          rm -rf /tmp/istore
          # 【run3 定根因】luci-app-store 的 LUCI_EXTRA_DEPENDS 写成 "luci-lib-taskd (>=1.0.19)"，
          # ImmortalWrt master 的 apk/kconfig 新机制无法表达版本比较 → 整个符号被隐藏（run2 feed
          # 方式与 run3 本地方式不可见的共同解释；lucky 无版本比较故一直存活）。
          # 依赖与 taskd 同仓库、版本天然匹配 → 去掉比较符仅保留包名。
          if [ -f package/istore/luci-app-store/Makefile ]; then
            sed -i 's/^LUCI_EXTRA_DEPENDS:=luci-lib-taskd.*/LUCI_EXTRA_DEPENDS:=luci-lib-taskd/' package/istore/luci-app-store/Makefile
            grep '^LUCI_EXTRA_DEPENDS' package/istore/luci-app-store/Makefile
          fi
          ls package/istore/ package/lucky/
          # USB 打印机：kmod-usb-printer 依赖虚拟包 printer-support，master 符号不可见
          #   → usblp 直接内核内置，等效且更稳
          if grep -q '^CONFIG_USB_PRINTER' target/linux/rockchip/armv8/config-6.18; then
            sed -i 's/^CONFIG_USB_PRINTER.*/CONFIG_USB_PRINTER=y/' target/linux/rockchip/armv8/config-6.18
          else
            printf 'CONFIG_USB_PRINTER=y\n' >> target/linux/rockchip/armv8/config-6.18
          fi

      - name: 更新并安装 feeds
        run: |
          # 防呆：feeds 配置完整性检查（上游漂移/误改即快速失败，不带病编译）
          grep -q '^src-git packages' feeds.conf.default || { echo '[FATAL] feeds.conf.default 缺 src-git packages'; exit 1; }
          grep -q '^src-git luci' feeds.conf.default || { echo '[FATAL] feeds.conf.default 缺 src-git luci'; exit 1; }
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # store 本地包落地确认（可见性最终以第 9 步 validate 为准）
          grep -l 'Package/luci-app-store' package/istore/*/Makefile && echo '[LOCAL-OK] luci-app-store (package/istore)' || echo '[LOCAL-MISS] luci-app-store!!'

      - name: 部署定制配置并生成 .config
        run: |
          cp ../h68k-custom/config/hinlink_h68k.config .config
          make defconfig
          echo "::group::.config 关键项调试输出"
          grep -iE 'hinlink|app-store|taskd|openclash|dnsmasq|USB_PRINTER|luci-i18n-base-zh' .config || true
          echo "::endgroup::"
          python3 ../h68k-custom/scripts/validate_config.py || {
            echo "::group::.config 诊断 dump（相关行全文）"
            grep -iE 'openclash|store|taskd|lucky|dnsmasq|tailscale|cups|avahi' .config | head -n 120 || true
            echo "::endgroup::"
            echo "::group::iStore 专项诊断（store 符号是否在 kconfig 索引 / 直接编译是否报错）"
            grep -n 'app-store' tmp/.config-package.in | head -n 10 || echo '[STORE-HIDDEN] luci-app-store 不在 kconfig 索引中'
            make package/istore/luci-app-store/{clean,compile} -j1 V=sc > store-diag.log 2>&1; echo "make exit=$?"
            tail -n 40 store-diag.log || true
            echo "::endgroup::"
            exit 1
          }

      - name: 下载源并预编译工具链
        run: |
          make download -j8
          find dl -size -1024c -exec rm -f {} \; || true
          make -j$(($(nproc)-1)) V=sc tools/compile toolchain/compile > build-env.log 2>&1
          rc=$?
          tail -n 20 build-env.log
          exit $rc

      - name: 编译固件
        id: compile
        run: |
          make -j$(($(nproc)-1)) > build.log 2>&1
          rc=$?
          echo "make exit = $rc"
          tail -n 25 build.log
          exit $rc
        continue-on-error: true

      - name: 编译失败日志摘要
        if: steps.compile.outcome == 'failure'
        run: |
          echo "::group::最后 150 行编译日志"
          tail -n 150 build.log || true
          echo "::endgroup::"
          echo "排查指引见 README「编译失败怎么办」。"
          exit 1

      - name: 打包产物
        if: steps.compile.outcome == 'success'
        run: |
          mkdir -p out
          find bin/targets/rockchip/armv8 -maxdepth 2 -name '*sysupgrade*.img*' -exec cp {} out/ \;
          [ -f bin/targets/rockchip/armv8/sha256sums ] && cp bin/targets/rockchip/armv8/sha256sums out/ || true
          cp .config out/config.seed
          ( cd out && sha256sum *.img* > images.sha256 ) 2>/dev/null || true
          ls -lh out/
          if [ "${{ inputs.upload_packages }}" = "true" ]; then
            tar -czf out/packages-full.tar.gz -C bin . || true
          fi

      - name: 上传固件
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-h68k-run${{ github.run_number }}
          path: openwrt/out/*
          retention-days: 30

      - name: 写入 Summary
        if: steps.compile.outcome == 'success'
        run: |
          {
            echo "## ImmortalWrt H68K 固件编译成功"
            echo ""
            echo "在 Actions 页面本页最底部的 **Artifacts** 下载：immortalwrt-h68k-run${{ github.run_number }}"
            echo ""
            echo "### 镜像文件"
            ls -lh out/ | grep -iE 'img|tar' || true
            echo ""
            echo "### SHA256"
            echo '```'
            cat out/images.sha256 2>/dev/null || true
            echo '```'
            echo ""
            echo "### 烧录与默认信息"
            echo "- TF 卡体验：balenaEtcher 直写 .img.gz（保留 eMMC 原厂系统）"
            echo "- 写 eMMC：先用 TF 版验证正常后，再在系统内 dd 到 /dev/mmcblk0（见 README）"
            echo "- 默认管理地址: http://192.168.1.1  用户: root  密码: 空（登录后请先设密码）"
          } >> "$GITHUB_STEP_SUMMARY"
